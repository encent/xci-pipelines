# METALoci 1.3.2 satellite environment.
#
# Python 3.11 is forced and is the ONLY workable version:
#   metaloci 1.3.2 pins scipy==1.16.1   -> requires python >= 3.11
#   metaloci 1.3.2 pins matplotlib==3.7.2 -> wheels stop at cp311
# NOTE: an earlier version of this comment claimed every METALoci `==` pin is
# satisfied from conda so pip resolves nothing. THAT IS FALSE and the env could
# not be built. conda supplies pybedtools 0.12.0, pip insists on 0.9.1, no
# cp311 wheel exists, and the source build runs in an isolated PEP-517
# environment without setuptools and dies. Adding setuptools does not help --
# build isolation is the cause, not a missing package.
#
# Fix: install metaloci with --no-deps and supply the deps from conda. `imageio`
# and `imageio-ffmpeg` are added explicitly because they are genuine runtime
# imports (metaloci/tools/scan.py:23) that the conda list omits.
#
# Known deviation: pybedtools resolves to 0.12.0, not the pinned 0.9.1 (which
# exists on neither channel). METALoci uses it only for interval arithmetic.
name: xci-metaloci
channels: [conda-forge, bioconda, nodefaults]
dependencies:
  - python=3.11
  - numpy=1.26.4
  - scipy=1.16.1
  - pandas=2.0.3
  - matplotlib-base=3.7.2
  - seaborn=0.11.0
  - networkx=3.1
  - h5py=3.10.0
  - shapely=2.1.1
  - geopandas=0.13.2
  - libpysal=4.13.0
  - esda=2.7.0
  - numba=0.61.2
  - cooler=0.9.2
  - bioframe=0.8.0
  - pybedtools
  - bedtools
  - hic-straw=1.3.1
  - adjusttext=1.1.1
  - dill=0.3.8
  - scikit-learn
  - pillow
  - tqdm
  - pyyaml
  - pip
  - pip:
      - --no-deps
      - metaloci==1.3.2
      - imageio
      - imageio-ffmpeg
